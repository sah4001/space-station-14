- type: entity
  abstract: true
  parent: [ DrinkBaseMaterialGlass, SolutionNormal, DrinkBase, DrinkBaseOpenable, DrinkBaseEmptyTrash ]
  id: DrinkBottleRefillingBase
  components:
  - type: Openable
    sound:
      collection: bottleOpenSounds
    closeable: true
    closeSound:
      collection: bottleCloseSounds
  - type: Sprite
    sprite: Objects/Consumable/Drinks/alco-bottle-refill.rsi # fallback
    layers:
    - state: icon_empty
      map: ["enum.OpenableVisuals.Layer"]
    - state: fill-5 # this will need to be different with a different maxFillLevels
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: Item
    size: Normal
  - type: Tag
    tags:
    - DrinkBottle
    - Trash

- type: entity
  parent: DrinkBottleRefillingBase
  id: DrinkAleBottleRefilling
  name: Refilling Ale
  description: This is a refilling bottle of ale
  suffix: Refilling
  components:
  - type: Label
    currentLabel: reagent-name-ale
  - type: Solution
    solution:
      reagents:
      - ReagentId: Ale
        Quantity: 120
  - type: SolutionFilling
    ReagentId: Ale
    RefillRate: 10
    maxFrameTime: 0.25
    energyPerUnit: 1

